[parse]
net_name = 'E41'
framework = 'onnx'
network = './fmodel/e_v41/model.onnx'
network_exdata = './fmodel/e_v41/model.onnx.data'
jr_path = './jr_path/E41/'
max_prompt_length = 32
max_tokens_length = 512
target = 'zhuge'
llm_mode = true
quantized = true

[optimize]
target = 'zhuge'
json = './jr_path/E41/E41-decoder_parsed.json'
raw = './jr_path/E41/E41-decoder_parsed.raw'
jr_path = './jr_path/E41/'

[quantize]
json = './jr_path/E41/E41-decoder_optimized.json'
raw = './jr_path/E41/E41-decoder_optimized.raw'
jr_path = './jr_path/E41/'
qdtype = "fp16"
target = "zhuge"

[adapt]
target = 'zhuge'
json = './jr_path/E41/E41-decoder_quantized.json'
raw = './jr_path/E41/E41-decoder_quantized.raw'
jr_path = './jr_path/E41/'
pass_off = "icraft.MergeTransDataOpSeqPass"

[generate]
json = './jr_path/E41/E41-decoder_adapted.json'
raw = './jr_path/E41/E41-decoder_adapted.raw'
jr_path = './jr_path/E41/'
